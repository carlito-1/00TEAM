<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MVP del Mes - 00TEAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- Librería para el efecto de confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b132b;
            background-image: radial-gradient(circle at top right, #1c2541, #0b132b);
            color: #ffffff;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .gold-gradient {
            background: linear-gradient(135deg, #facc15 0%, #d97706 100%);
        }
        
        .text-gold {
            background: linear-gradient(135deg, #facc15 0%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Animación para el PopUp y el ganador */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95) translate(-50%, -50%); } to { opacity: 1; transform: scale(1) translate(-50%, -50%); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 80% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
        
        .modal-anim { animation: fadeIn 0.3s ease-out forwards; }
        .winner-anim { animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>

<body class="p-4 md:p-8 relative">

    <!-- Efecto visual de fondo -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-yellow-500/10 blur-[120px] rounded-full pointer-events-none z-0"></div>

    <div class="max-w-5xl mx-auto relative z-10" id="mainContent">

        <!-- ENCABEZADO -->
        <header id="headerVotacion" class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6 glass-card p-6 rounded-2xl border-t-4 border-t-yellow-400">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='index.html'" class="w-10 h-10 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center transition border border-white/20">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <div>
                    <h1 class="text-3xl font-extrabold tracking-tight uppercase">MVP <span class="text-gold">DEL MES</span></h1>
                    <p class="text-sm text-gray-400 font-medium" id="subtituloHeader">Vota al mejor jugador de este mes</p>
                </div>
            </div>
            <div id="estadoVoto" class="hidden bg-green-500/20 border border-green-500/50 text-green-400 px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                Ya has votado este mes
            </div>
        </header>

        <!-- CONTENEDOR DE NOMINADOS -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="nominadosContainer">
            <!-- Las tarjetas se inyectan por JS -->
        </div>

    </div>

    <!-- MODAL DE CONFIRMACIÓN (Oculto por defecto) -->
    <div id="modalConfirmacion" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
        <div class="modal-anim absolute top-1/2 left-1/2 w-[90%] max-w-sm glass-card p-6 rounded-2xl border border-yellow-400/30 text-center shadow-2xl">
            <div class="w-16 h-16 bg-yellow-400/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-yellow-400/50">
                <span class="text-2xl">🏆</span>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">Confirmar Voto</h3>
            <p class="text-sm text-gray-300 mb-6">¿Estás seguro de que quieres dar tu voto a <span id="nombreVoto" class="font-bold text-yellow-400"></span>? Esta acción no se puede deshacer.</p>
            
            <div class="flex gap-3 justify-center">
                <button onclick="cerrarModal()" class="flex-1 bg-white/10 hover:bg-white/20 text-white font-bold py-2.5 rounded-lg transition border border-white/20 text-sm">
                    Cancelar
                </button>
                <button id="btnConfirmarVoto" class="flex-1 gold-gradient hover:opacity-90 text-[#0b132b] font-bold py-2.5 rounded-lg transition text-sm shadow-[0_0_15px_rgba(250,204,21,0.4)]">
                    Sí, Votar
                </button>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="basededatos.js"></script>
    <script>
        let jugadorSeleccionadoParaVotar = null;

        // FUNCIÓN PARA LANZAR CONFETI
       // FUNCIÓN PARA LANZAR CONFETI DORADO INFINITO
        function lanzarConfeti() {
            // Definimos una paleta exclusiva de dorados, amarillos y blanco brillante
            var coloresDorados = ['#facc15', '#d97706', '#fbbf24', '#fef3c7', '#ffffff'];
            
            var defaults = { 
                startVelocity: 30, 
                spread: 360, 
                ticks: 60, 
                zIndex: 0,
                colors: coloresDorados // Le decimos que SOLO use estos colores
            };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            // Quitamos el límite de tiempo, esto se ejecutará para siempre (hasta que cierres la página)
            setInterval(function() {
                var particleCount = 20; // Mantenemos un flujo constante y elegante
                
                // Disparo desde la izquierda
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
                }));
                
                // Disparo desde la derecha
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
                }));
            }, 250);
        }

        // 2. FUNCIÓN PARA PINTAR LAS TARJETAS (O AL GANADOR)
        // 2. FUNCIÓN PARA PINTAR LAS TARJETAS (O AL GANADOR)
        async function pintarNominados() {
            // Traemos los datos de la base de datos (con tu columna 'mvps')
            const { data: datos_potm, error } = await clienteSupabase
                .from('datos_potm') 
                .select(`
                    nombre, 
                    partido,
                    goles,
                    asistencias,
                    ganador,
                    mvps
                `);

            const container = document.getElementById("nominadosContainer");
            
            if (error) {
                console.error("Error al cargar nominados:", error);
                container.innerHTML = '<p class="text-red-500 text-center col-span-3">Error al cargar los nominados.</p>';
                return;
            }

            // Traemos todos los votos reales para contar
            const { data: votosReales } = await clienteSupabase.from('potm').select('nombre');
            
            const conteoVotos = {};
            let totalVotosEmitidos = 0;
            if (votosReales) {
                votosReales.forEach(voto => {
                    conteoVotos[voto.nombre] = (conteoVotos[voto.nombre] || 0) + 1;
                    totalVotosEmitidos++;
                });
            }

            // --- LÓGICA DE AGRUPACIÓN PARA EL HISTORIAL ---
            const jugadoresAgrupados = {};
            datos_potm.forEach(registro => {
                const nombre = registro.nombre;
                if (!jugadoresAgrupados[nombre]) {
                    jugadoresAgrupados[nombre] = {
                        nombre: nombre,
                        partidos_totales: 0,
                        golesTotales: 0,
                        asistenciasTotales: 0,
                        mvps_totales: 0,
                        ganador: false,
                        historial: [] 
                    };
                }
                
                if (registro.ganador === true) {
                    jugadoresAgrupados[nombre].ganador = true;
                }
                
                jugadoresAgrupados[nombre].mvps_totales += (registro.mvps || 0);
                jugadoresAgrupados[nombre].partidos_totales += 1;
                jugadoresAgrupados[nombre].golesTotales += (registro.goles || 0);
                jugadoresAgrupados[nombre].asistenciasTotales += (registro.asistencias || 0);
                
                jugadoresAgrupados[nombre].historial.push({
                    rival: registro.partido || 'Desconocido',
                    goles: registro.goles || 0,
                    asistencias: registro.asistencias || 0,
                    mvps: registro.mvps || 0 // <-- Guardado con 's'
                });
            });

            const nominadosFinales = Object.values(jugadoresAgrupados);
            
            // --- COMPROBAR SI HAY GANADOR ---
            const jugadorGanador = nominadosFinales.find(j => j.ganador === true);

            if (jugadorGanador) {
                document.getElementById("headerVotacion").style.display = "none";
                container.className = "flex flex-col items-center justify-center min-h-[70vh] text-center w-full";

                const ranking = nominadosFinales.sort((a, b) => (conteoVotos[b.nombre] || 0) - (conteoVotos[a.nombre] || 0));
                
                let estadisticasHTML = `<div class="mt-12 bg-black/40 p-6 rounded-2xl border border-white/10 w-full max-w-lg glass-card shadow-xl">`;
                estadisticasHTML += `<h4 class="text-yellow-400 font-bold mb-4 uppercase tracking-wider text-sm flex items-center justify-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg> Resultados Finales (${totalVotosEmitidos} votos)</h4>`;
                
                ranking.forEach(candidato => {
                    const votos = conteoVotos[candidato.nombre] || 0;
                    const esElGanador = candidato.nombre === jugadorGanador.nombre;
                    estadisticasHTML += `
                        <div class="flex justify-between items-center py-3 border-b border-white/5 last:border-0">
                            <span class="${esElGanador ? 'text-yellow-400 font-black text-lg' : 'text-gray-300 font-semibold'}">${candidato.nombre}</span>
                            <span class="${esElGanador ? 'bg-yellow-400 text-[#0b132b] shadow-[0_0_10px_rgba(250,204,21,0.5)]' : 'bg-white/10 text-white'} px-3 py-1 rounded-md text-xs font-bold">${votos} votos</span>
                        </div>
                    `;
                });
                estadisticasHTML += `</div>`;

                container.innerHTML = `
                    <div class="winner-anim flex flex-col items-center w-full">
                        <button onclick="window.location.href='index.html'" class="absolute top-0 left-0 w-10 h-10 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center transition border border-white/20">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        
                        <h4 class="text-lg md:text-xl font-bold text-gray-400 uppercase tracking-[0.3em] mb-2">Votaciones cerradas</h4>
                        <h2 class="text-5xl md:text-7xl font-black text-gold mb-8 uppercase tracking-tight animate-pulse" style="text-shadow: 0 0 30px rgba(250,204,21,0.3);">MVP DEL MES</h2>
                        
                        <div class="w-56 h-56 md:w-72 md:h-72 rounded-full overflow-hidden border-8 border-yellow-400 shadow-[0_0_80px_rgba(250,204,21,0.6)] mb-6 relative z-10 bg-[#1c2541]">
                            <img src="https://00team.vercel.app/public/${jugadorGanador.nombre}.png" alt="${jugadorGanador.nombre}" class="w-full h-full object-cover">
                        </div>
                        
                        <h3 class="text-4xl md:text-6xl font-black text-white uppercase tracking-widest mb-2">${jugadorGanador.nombre}</h3>
                        
                        ${estadisticasHTML}
                    </div>
                `;

                lanzarConfeti();
                return;
            }

            // --- SI NO HAY GANADOR, PINTAMOS LAS TARJETAS NORMALES ---
            const yaVotado = comprobarCookie("votoMVP");

            if (yaVotado) {
                document.getElementById("estadoVoto").classList.remove("hidden");
            }
            
            nominadosFinales.forEach(jugador => {
                
                let desgloseHTML = "";
                jugador.historial.forEach(p => {
                    
                    // ¡AQUÍ ESTABA EL FALLO! Tiene que ser p.mvps > 0
                    const etiquetaMVP = p.mvps > 0 
                        ? `<span class="ml-2 text-[9px] bg-yellow-400/20 text-yellow-400 px-1.5 py-0.5 rounded border border-yellow-400/40 font-bold tracking-wider">⭐ ${p.mvps} MVP</span>` 
                        : '';
                    
                    desgloseHTML += `
                        <li class="flex justify-between items-center py-2 border-b border-gray-700/50 last:border-0">
                            <span class="text-xs font-medium text-gray-300 truncate pr-2 w-[55%]">Vs ${p.rival} ${etiquetaMVP}</span>
                            <div class="flex gap-1.5 w-[45%] justify-end">
                                <span class="text-[15px] font-bold bg-white/10 px-1.5 py-0.5 rounded text-white flex items-center gap-1">⚽ ${p.goles}</span>
                                <span class="text-[15px] font-bold bg-white/10 px-1.5 py-0.5 rounded text-white flex items-center gap-1">👟 ${p.asistencias}</span>
                            </div>
                        </li>
                    `;
                });

                const card = document.createElement("div");
                card.className = "glass-card rounded-2xl overflow-hidden flex flex-col relative group hover:-translate-y-2 transition duration-300 border-t-2 border-t-white/10 hover:border-t-yellow-400";
                
                const estadoBoton = yaVotado 
                    ? `<button disabled class="w-full bg-white/5 text-gray-500 font-bold py-3 uppercase tracking-wider text-xs cursor-not-allowed">Voto Registrado</button>`
                    : `<button onclick="abrirModal('${jugador.nombre}')" class="w-full gold-gradient text-[#0b132b] font-bold py-3 uppercase tracking-wider text-sm hover:opacity-90 transition">Votar a ${jugador.nombre}</button>`;

                card.innerHTML = `
                    <div class="relative pt-8 pb-4 flex flex-col items-center bg-gradient-to-b from-black/40 to-transparent">
                        <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-[#1c2541] shadow-[0_0_20px_rgba(250,204,21,0.2)] mb-3 relative z-10 group-hover:scale-105 transition">
                            <img src="https://00team.vercel.app/public/${jugador.nombre}.png" alt="${jugador.nombre}" class="w-full h-full object-cover" onerror="this.src='https://ui-avatars.com/api/?name=${jugador.nombre}&background=facc15&color=0b132b&size=150'">
                        </div>
                        <h2 class="text-xl font-black uppercase tracking-widest text-white">${jugador.nombre}</h2>
                        <span class="text-[10px] text-yellow-400 font-bold tracking-widest uppercase">Nominado</span>
                    </div>

                    <div class="px-6 py-4 flex-grow flex flex-col">
                        
                        <!-- ¡AQUÍ ESTABA EL SEGUNDO FALLO! Faltaba la 4ª columna -->
                        <div class="grid grid-cols-4 gap-1 text-center bg-black/40 rounded-t-xl p-2 border border-white/5 border-b-0">
                            <div>
                                <p class="text-[8px] text-gray-400 uppercase font-bold mb-1">Partidos</p>
                                <p class="text-lg font-black text-white">${jugador.partidos_totales}</p>
                            </div>
                            <div class="border-l border-white/10">
                                <p class="text-[8px] text-gray-400 uppercase font-bold mb-1">Goles</p>
                                <p class="text-lg font-black text-yellow-400">${jugador.golesTotales}</p>
                            </div>
                            <div class="border-l border-white/10">
                                <p class="text-[8px] text-gray-400 uppercase font-bold mb-1">Asist.</p>
                                <p class="text-lg font-black text-yellow-400">${jugador.asistenciasTotales}</p>
                            </div>
                            <div class="border-l border-white/10">
                                <p class="text-[8px] text-gray-400 uppercase font-bold mb-1">MVPs</p>
                                <p class="text-lg font-black text-yellow-400">${jugador.mvps_totales} ⭐</p>
                            </div>
                        </div>

                        <div class="bg-black/20 rounded-b-xl p-3 border border-white/5 border-t-0 flex-grow">
                            <h4 class="text-[8px] text-gray-500 uppercase font-bold mb-2 tracking-wider text-center border-b border-white/5 pb-2">Detalles de los partidos</h4>
                            <ul class="m-0 p-0">
                                ${desgloseHTML}
                            </ul>
                        </div>
                    </div>

                    <div class="mt-auto">
                        ${estadoBoton}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 3. LÓGICA DEL MODAL
        const modal = document.getElementById("modalConfirmacion");
        const spanNombre = document.getElementById("nombreVoto");
        const btnConfirmar = document.getElementById("btnConfirmarVoto");

        function abrirModal(nombreJugador) {
            jugadorSeleccionadoParaVotar = nombreJugador;
            spanNombre.textContent = nombreJugador;
            modal.classList.remove("hidden");
        }

        function cerrarModal() {
            jugadorSeleccionadoParaVotar = null;
            modal.classList.add("hidden");
        }

        btnConfirmar.addEventListener("click", async () => {
            if (jugadorSeleccionadoParaVotar) {
                
                btnConfirmar.textContent = "Votando...";
                btnConfirmar.disabled = true;

                const { error } = await clienteSupabase
                    .from('potm')
                    .insert([
                        { nombre: jugadorSeleccionadoParaVotar }
                    ]);

                if (error) {
                    console.error("Error al guardar el voto:", error);
                    alert("Hubo un error al registrar tu voto. Inténtalo de nuevo.");
                    btnConfirmar.textContent = "Sí, Votar";
                    btnConfirmar.disabled = false;
                    return;
                }
                
                crearCookie("votoMVP", "true", 6);
                cerrarModal();
                window.location.reload();
            }
        });

        // 4. SISTEMA DE COOKIES
        function crearCookie(nombre, valor, dias) {
            const fecha = new Date();
            fecha.setTime(fecha.getTime() + (dias * 24 * 60 * 60 * 1000));
            const expiracion = "expires=" + fecha.toUTCString();
            document.cookie = nombre + "=" + valor + ";" + expiracion + ";path=/";
        }

        function comprobarCookie(nombre) {
            const nombreC = nombre + "=";
            const cookiesDecodificadas = decodeURIComponent(document.cookie);
            const arrayCookies = cookiesDecodificadas.split(';');
            for(let i = 0; i < arrayCookies.length; i++) {
                let c = arrayCookies[i];
                while (c.charAt(0) == ' ') { c = c.substring(1); }
                if (c.indexOf(nombreC) == 0) { return true; }
            }
            return false;
        }

        // INICIAR
        pintarNominados();
    </script>
</body>
</html>
